# The testbed's shared broker. Queues are lifted so that losses come from the
# systems under test, never from the broker's own per-client limits.
listener 1883
allow_anonymous true
persistence false
max_inflight_messages 1000
max_queued_messages 1000000
# Mosquitto 2.1 refuses large packets by default; the northbound sizes reach 2 MiB.
max_packet_size 268435455
# Without it, Nagle holds a forwarded message behind the PUBACK the broker just sent on the same connection
# until the client's delayed ACK (~40 ms): every MQTT 5 request/reply (southbound) paid that, whoever answered.
set_tcp_nodelay true
log_type error
log_type warning
